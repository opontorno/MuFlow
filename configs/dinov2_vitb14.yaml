# DINOv2 ViT-B/14  —  pretrained on LVD-142M (timm: vit_base_patch14_dinov2.lvd142m)
# input_size must be a multiple of patch_size=14 → 224 (14×16)
# out_indices here denotes transformer block indices (0-indexed, 12 blocks total)
# taking the last 3 blocks for 3 NF heads

input_size: 224
backbone_name: dinov2_vitb14
flow_step: 8
hidden_ratio: 1.0
conv3x3_only: True
pooling_type: flatten   # choices: 'mean', 'flatten', 'max', 'mean_std'
gmm_n_components: 1
out_indices: [9, 10, 11]
preprocessing: none
